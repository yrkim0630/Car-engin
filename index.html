<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D V8 Engine Simulator</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0b0b0e;
            color: #e0e0e0;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            display: flex;
        }
        #canvas-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        .ui-overlay {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            width: 100%;
            height: 100%;
            pointer-events: none;
            padding: 20px;
        }
        header, .dashboard {
            pointer-events: auto;
            background: rgba(20, 20, 25, 0.85);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 25px;
            max-width: 400px;
        }
        header h1 {
            font-size: 1.2rem;
            color: #ffaa00;
            letter-spacing: 1px;
        }
        .badge {
            background: #ff4500;
            color: white;
            padding: 4px 8px;
            font-size: 0.7rem;
            border-radius: 4px;
            font-weight: bold;
        }
        .dashboard {
            align-self: flex-end;
            width: 320px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 10px;
        }
        .gauge-group {
            text-align: center;
            background: rgba(10, 10, 15, 0.6);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.05);
        }
        .gauge-value {
            font-size: 2.5rem;
            font-weight: bold;
            color: #00ffcc;
            font-family: monospace;
            text-shadow: 0 0 10px rgba(0,255,204,0.3);
        }
        .gauge-label {
            font-size: 0.8rem;
            color: #888;
            margin-top: 4px;
            letter-spacing: 2px;
        }
        .controls {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        button {
            padding: 14px;
            font-size: 1rem;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            letter-spacing: 1px;
        }
        #ignition-btn {
            background: #d9534f;
            color: white;
            box-shadow: 0 4px 15px rgba(217, 83, 79, 0.4);
        }
        #ignition-btn.running {
            background: #28a745;
            box-shadow: 0 4px 15px rgba(40, 167, 69, 0.4);
        }
        .pedal-container {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .pedal-container label {
            font-size: 0.85rem;
            color: #aaa;
            display: flex;
            justify-content: space-between;
        }
        input[type=range] {
            width: 100%;
            accent-color: #ffaa00;
            cursor: pointer;
            height: 6px;
        }
        .instructions {
            font-size: 0.75rem;
            color: #777;
            text-align: center;
            margin-top: 5px;
        }
    </style>

    <!-- Three.js 및 OrbitControls CDN 불러오기 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <div id="canvas-container"></div>

    <div class="ui-overlay">
        <header>
            <h1>3D V8 ENGINE</h1>
            <span class="badge">WebGL 3D</span>
        </header>

        <div class="dashboard">
            <div class="gauge-group">
                <div class="gauge-value" id="rpmDisplay">0</div>
                <div class="gauge-label">RPM</div>
            </div>

            <div class="controls">
                <button id="ignition-btn">ENGINE START</button>
                
                <div class="pedal-container">
                    <label><span>가속 페달 (Throttle)</span></label>
                    <input type="range" id="throttleRange" min="0" max="100" value="0">
                </div>
            </div>
            <div class="instructions">마우스 드래그로 3D 시점을 회전할 수 있습니다.</div>
        </div>
    </div>

<script>
    // --- 1. Three.js 기본 씬 설정 ---
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0.0b0b0e, 0.015);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 8, 25);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.shadowMap.enabled = true;
    container.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;

    // 조명 설정
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
    dirLight.position.set(15, 30, 20);
    dirLight.castShadow = true;
    scene.add(dirLight);

    const pointLight = new THREE.PointLight(0xffaa00, 2, 50);
    pointLight.position.set(0, 0, 0);
    scene.add(pointLight);

    // --- 2. 3D V8 엔진 모델 구조 생성 ---
    const engineGroup = new THREE.Group();
    scene.add(engineGroup);

    // 재질(Materials) 정의
    const matIron = new THREE.MeshStandardMaterial({ color: 0x33353b, roughness: 0.4, metalness: 0.8 });
    const matPiston = new THREE.MeshStandardMaterial({ color: 0xcccccc, roughness: 0.2, metalness: 0.9 });
    const matRod = new THREE.MeshStandardMaterial({ color: 0xd4af37, roughness: 0.3, metalness: 0.8 }); // 골드빛 커넥팅로드
    const matCrank = new THREE.MeshStandardMaterial({ color: 0x555c66, roughness: 0.3, metalness: 0.9 });
    const matHead = new THREE.MeshStandardMaterial({ color: 0xcc2222, roughness: 0.4, metalness: 0.5 }); // 레드 헤드 커버

    // 엔진 블록 베이스
    const blockGeo = new THREE.BoxGeometry(4.2, 3.2, 7.5);
    const blockMesh = new THREE.Mesh(blockGeo, matIron);
    blockMesh.position.y = -0.6;
    engineGroup.add(blockMesh);

    // 실린더 및 피스톤 객
