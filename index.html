<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>V8 Engine Simulator - Pro 3D & Dyno</title>
    <!-- Three.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        :root {
            --bg-color: #0b0d10;
            --panel-bg: rgba(16, 20, 27, 0.9);
            --border-color: #242d3d;
            --accent-color: #00ffcc;
            --accent-glow: rgba(0, 255, 204, 0.3);
            --danger-color: #ff3344;
            --text-main: #e2e8f0;
            --text-muted: #8892b0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            user-select: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            height: 50px;
            background: linear-gradient(to bottom, #161b22, #0d0f12);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            z-index: 10;
        }

        .logo {
            font-weight: 700;
            font-size: 1.1rem;
            color: var(--accent-color);
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .logo span {
            color: #fff;
            font-weight: 400;
            font-size: 0.85rem;
            opacity: 0.7;
        }

        .main-container {
            flex: 1;
            display: grid;
            grid-template-columns: 320px 1fr 340px;
            grid-template-rows: 1fr 220px;
            height: calc(100vh - 50px);
            background: #07090c;
        }

        .panel {
            background: var(--panel-bg);
            border-right: 1px solid var(--border-color);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            backdrop-filter: blur(10px);
        }

        .panel-header {
            padding: 12px 16px;
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            border-bottom: 1px solid var(--border-color);
            background: rgba(13, 15, 18, 0.5);
        }

        .panel-body {
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        #viewport-container {
            grid-column: 2;
            grid-row: 1 / 3;
            position: relative;
            background: radial-gradient(circle at center, #151c28 0%, #06080c 100%);
            width: 100%;
            height: 100%;
        }

        #canvas3d {
            width: 100% !important;
            height: 100% !important;
            display: block;
        }

        .dyno-panel {
            grid-column: 3;
            grid-row: 1 / 3;
            border-right: none;
            border-left: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .control-group label {
            font-size: 0.8rem;
            color: var(--text-muted);
            display: flex;
            justify-content: space-between;
        }

        .control-group label span {
            color: var(--accent-color);
            font-weight: 600;
        }

        select, button {
            background: #161d2b;
            border: 1px solid var(--border-color);
            color: #fff;
            padding: 10px;
            border-radius: 6px;
            font-size: 0.9rem
