<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>V8 Engine Simulator - Pro 3D & Dyno</title>
    <!-- Three.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        :root {
            --bg-color: #0b0d10;
            --panel-bg: rgba(16, 20, 27, 0.9);
            --border-color: #242d3d;
            --accent-color: #00ffcc;
            --accent-glow: rgba(0, 255, 204, 0.3);
            --danger-color: #ff3344;
            --text-main: #e2e8f0;
            --text-muted: #8892b0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            user-select: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            height: 50px;
            background: linear-gradient(to bottom, #161b22, #0d0f12);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            z-index: 10;
        }

        .logo {
            font-weight: 700;
            font-size: 1.1rem;
            color: var(--accent-color);
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .logo span {
            color: #fff;
            font-weight: 400;
            font-size: 0.85rem;
            opacity: 0.7;
        }

        .main-container {
            flex: 1;
            display: grid;
            grid-template-columns: 320px 1fr 340px;
            grid-template-rows: 1fr 220px;
            height: calc(100vh - 50px);
            background: #07090c;
        }

        .panel {
            background: var(--panel-bg);
            border-right: 1px solid var(--border-color);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            backdrop-filter: blur(10px);
        }

        .panel-header {
            padding: 12px 16px;
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            border-bottom: 1px solid var(--border-color);
            background: rgba(13, 15, 18, 0.5);
        }

        .panel-body {
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        #viewport-container {
            grid-column: 2;
            grid-row: 1 / 3;
            position: relative;
            background: radial-gradient(circle at center, #151c28 0%, #06080c 100%);
        }

        #canvas3d {
            width: 100%;
            height: 100%;
            display: block;
        }

        .dyno-panel {
            grid-column: 3;
            grid-row: 1 / 3;
            border-right: none;
            border-left: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .control-group label {
            font-size: 0.8rem;
            color: var(--text-muted);
            display: flex;
            justify-content: space-between;
        }

        .control-group label span {
            color: var(--accent-color);
            font-weight: 600;
        }

        select, button {
            background: #161d2b;
            border: 1px solid var(--border-color);
            color: #fff;
            padding: 10px;
            border-radius: 6px;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        select:hover, button:hover {
            border-color: var(--accent-color);
        }

        button.primary {
            background: linear-gradient(135deg, #00ffcc 0%, #00b386);
            color: #07090c;
            font-weight: 700;
            border: none;
            box-shadow: 0 0 15px rgba(0,255,204,0.3);
        }

        button.primary:hover {
            opacity: 0.9;
            box-shadow: 0 0 20px rgba(0,255,204,0.5);
        }

        button.danger {
            background: linear-gradient(135deg, #ff3344 0%, #cc0011);
            color: #fff;
            font-weight: 700;
            border: none;
        }

        input[type="range"] {
            -webkit-appearance: none;
            width: 100%;
            height: 6px;
            background: #161d2b;
            border-radius: 3px;
            outline: none;
            border: 1px solid var(--border-color);
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: var(--accent-color);
            cursor: pointer;
            box-shadow: 0 0 10px var(--accent-glow);
        }

        .gauges-panel {
            grid-column: 1;
            grid-row: 2;
            border-top: 1px solid var(--border-color);
        }

        .gauges-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .gauge-box {
            background: #0b0d10;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 10px;
            text-align: center;
        }

        .gauge-value {
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--accent-color);
            font-family: monospace;
        }

        .gauge-label {
            font-size: 0.7rem;
            color: var(--text-muted);
            margin-top: 2px;
            text-transform: uppercase;
        }

        #dyno-canvas {
            width: 100%;
            height: 220px;
            background: #0b0d10;
            border-bottom: 1px solid var(--border-color);
            display: block;
        }

        .stats-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            font-size: 0.85rem;
        }

        .stat-row {
            display: flex;
            justify-content: space-between;
            padding-bottom: 6px;
            border-bottom: 1px dashed var(--border-color);
        }

        .stat-row span:last-child {
            font-family: monospace;
            font-weight: 600;
            color: #fff;
        }

        .floating-tips {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(11, 13, 16, 0.85);
            border: 1px solid var(--border-color);
            padding: 10px 15px;
            border-radius: 8px;
            font-size: 0.8rem;
            color: var(--text-muted);
            pointer-events: none;
            backdrop-filter: blur(5px);
        }
    </style>
</head>

    <header>
        <div class="logo">
            ⚙️ V8 ENGINE SIMULATOR <span>Pro 3D Detailed</span>
        </div>
        <div style="font-size: 0.8rem; color: var(--text-muted);">
            GitHub Pages Ready • Web Audio & Red Trumpets
        </div>
    </header>

    <div class="main-container">
        <!-- 좌측: 제어 패널 -->
        <div class="panel" style="grid-row: 1;">
            <div class="panel-header">V8 Engine Controls</div>
            <div class="panel-body">
                <div class="control-group">
                    <label>엔진 사양</label>

                    </div>
                </div>

                <div class="control-group">

                <div class="control-group">

                    <input type="range" id="throttleInput" min="0" max="100" value="0">
                </div>

                <div class="control-group">
                    <label>카메라 뷰</label>
                    <select id="cameraMode">
                        <option value="orbit">자유 회전 (Orbit)</option>
                        <option value="top">상단 트럼펫 뷰 (Top Trumpets)</option>
                        <option value="side">측면 크랭크 뷰 (Side Profile)</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- 하단 좌측: 계기판 -->
        <div class="panel gauges-panel">
            <div class="panel-header">Telemetry Dashboard</div>
            <div class="panel-body">
                <div class="gauges-grid">
                    <div class="gauge-box">
                        <div class="gauge-value" id="rpmDisplay">800</div>

                    </div>
                    <div class="gauge-box">
                        <div class="gauge-value" id="torqueDisplay">70</div>
                        <div class="gauge-label">Torque (Nm)</div>
